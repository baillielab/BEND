name: enhancer_annotation
embedder: ${embedder} # used in trainer class
output_dir: ${output_dir} # used in trainer class

dataset:
  _target_: bend_hybrid.embedding.datasets.DataSupervised
  annotations_path: ${data_dir}/enhancer_annotation/enhancer_annotation.bed
  genome_path: ${data_dir}/genomes/GRCh38.primary_assembly.genome.fa
  hdf5_path: ${data_dir}/enhancer_annotation/enhancer_annotation.hdf5
  label_depth: 1
  sequence_length: null # When null, indicates uneven length sequences
  n_samples: null # Set to an integer to undersample the dataset
dataloaders:
  _target_: bend_hybrid.downstream.dataloaders.get_dataloaders
  shards_dir: ${embeddings_output_dir}
  batch_size: 8
  num_workers: 2
  prefetch_factor: 2
  padding_value: -100
  shuffle: 16
  shardshuffle: 32
  fold_idx: null # When null, perform cross-validation across all folds
model:
  _target_: bend_hybrid.models.downstream.CNN
  input_size: ${embedding.${embedder}.embeddings_dim}
  output_size: ${task.dataset.label_depth}
  hidden_size: 2
  kernel_size: 3
  output_downsample_window: 128
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001
  weight_decay: 0.01
params:
  epochs: 100
  load_checkpoint: false
  gradient_accumulation_steps: 1
  criterion: bce
  class_weights:
    - 82.86
  metric: auprc
  activation: none
wandb:
  mode: disabled
