# @package _global_
defaults:
  - override /hydra/sweeper: optuna
  - override /hydra/sweeper/sampler: tpe
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    sampler:
      seed: 42
    direction: minimize
    study_name: ${task.name}-${embedder}
    storage: null
    n_trials: 5
    n_jobs: 1
    params:
      task.dataloaders.num_workers: choice(1, 2, 4, 8)
      task.dataloaders.prefetch_factor: choice(1, 2, 4)
      task.dataset.n_samples: 50000 # Set to an integer to undersample the dataset
      max_shard_size: choice(500000000, 3000000000, 15000000000) # max size of each shard in bytes (0.5GB, 3GB, 15GB)
  sweep:
    dir: ./sweeps/${hydra.sweeper.study_name}
    subdir: ${now:%Y-%m-%d}_${hydra.job.num}
